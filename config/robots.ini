# Robots that `ditx deploy / up / logs -r <name>` can target.
# Add and remove them with `ditx robot add|remove` (comments here are kept), or edit by hand.
#   host      robot hostname (or user@host, or a Host alias from ~/.ssh/config); "local" = this machine.
#             A DIT-Scripts hostname without user@ is reached with your own team
#             account (DIT_ROBOT_USER in .env, set by `ditx init`)
#   arch      amd64 | arm64 (overlays are built for it)
#   domain_id ROS_DOMAIN_ID of everything on that robot
#   profiles  which services of docker/compose.yaml run there (domains + extras:
#             firmware = micro-ROS agent, monitoring = netdata)
#   tag       image tag the robot runs: stable (main), develop, or a release vX.Y.Z
#   discovery subnet (default) | localhost: keep DDS on this machine (sim on a laptop,
#             so it never talks to a real robot on the lab network)
#   foreign_topics  topics of systems outside DIT-X on this robot, e.g. a web dashboard
#             (fnmatch patterns, comma separated): `ditx contract live` does not flag them
#
# A robot is configuration, not a git branch: per-robot parameters live in each
# domain's <domain>_bringup/config/robots/<robot>.yaml.
#
# Robot hostnames follow DIT-Scripts: DIT-<year>-<last IP octet>, and ROS_DOMAIN_ID is that number.
# Example of a real robot (or: ditx robot add white --host DIT-2026-11):
#   [white]
#   host = dit-2026-11.local
#   arch = amd64
#   domain_id = 11
#   profiles = main,navigation,localization,vision,firmware,monitoring
#   tag = stable

[sim]
host = local
arch = amd64
domain_id = 42
profiles = main,navigation,localization,vision
tag = develop
discovery = localhost
note = everything on this laptop, state under .sim-robot/
