# Shell repo pipeline. Every job only calls `bin/ditx ...`, so running the same
# command on your laptop reproduces CI exactly:
#   ditx ci lint | ditx ci build | ditx ci test | ditx ci cross
# The repos are public, so GHCR stores and serves their images for free: after the
# checks pass on a push, `publish` pushes them (develop → :develop, main → :stable,
# vX.Y.Z → :vX.Y.Z). `ditx image` still builds the same images locally.
name: ci

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/seanchangx
  # CI jobs build the dev image from THIS commit and run every stage inside it
  DIT_DEV_IMAGE: ghcr.io/seanchangx/eurobot-dev:ci
  DIT_CROSS_IMAGE: ghcr.io/seanchangx/eurobot-cross:ci
  DIT_BAKE_CACHE: type=gha
  FORCE_COLOR: '1'

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits title (squash merge uses it as the commit message)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_/-]+\))?!?: .{3,}$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title must look like 'feat(localization): fuse camera pose' (got: $TITLE)"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          sync-token: ${{ secrets.DIT_SYNC_TOKEN }}
      - run: bin/ditx ci lint

  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    # Humble is what the robots run and must pass; Jazzy is the next distro:
    # keep it building so the migration is ready, but do not block merges on it.
    continue-on-error: ${{ matrix.ros_distro == 'jazzy' }}
    env:
      ROS_DISTRO: ${{ matrix.ros_distro }}
      DIT_BAKE_CACHE: type=gha,scope=${{ matrix.ros_distro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the scope check diffs against the base
      # A docs-only change into develop (docs/, mkdocs.yml, *.md) cannot break a build: the
      # steps are skipped, but the job itself runs, so the matrix expands and the required
      # check "build-test (humble)" reports success. (A job-level `if` would skip the job
      # before the matrix expands and leave the required check pending forever.) PRs into
      # main, pushes to main and release tags always run everything.
      - name: Scope
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          INTO_DEVELOP: ${{ (github.event_name == 'pull_request' && github.base_ref == 'develop') || github.ref == 'refs/heads/develop' }}
        run: |
          run=true
          if [[ "$INTO_DEVELOP" == true ]] && .github/scripts/docs-only.sh "$BASE" "$GITHUB_SHA"; then
            run=false
            echo "::notice::docs-only change: build and tests skipped (docs.yml checks the docs)"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup
        with:
          sync-token: ${{ secrets.DIT_SYNC_TOKEN }}
      - if: steps.scope.outputs.run == 'true'
        run: bin/ditx ci build
      - if: steps.scope.outputs.run == 'true'
        run: bin/ditx ci test
      # The stack the way a robot runs it, which the sim and the integration test do not: the
      # runtime images, subnet discovery (docker/cyclonedds.xml) and containers running as the
      # runner's uid 1001, which has no passwd entry in the image (like DIT-Scripts accounts).
      - name: Robot stack (subnet discovery, uid without a home)
        if: steps.scope.outputs.run == 'true' && matrix.ros_distro == 'humble'
        run: |
          bin/ditx image --target runtime --tag ci
          bin/ditx robot add ci --host local --domain-id 77 --tag ci
          trap 'bin/ditx down -r ci --yes' EXIT
          bin/ditx up -r ci
          for try in 1 2 3 4 5 6; do   # the domains need a few seconds to come up
            bin/ditx contract live -r ci && exit 0
            sleep 10
          done
          for d in main navigation localization vision; do bin/ditx logs -r ci -d "$d" | tail -20; done
          exit 1
      - name: arm64 (cross compiled, what arm64 robots get from ditx deploy)
        if: steps.scope.outputs.run == 'true'
        run: |
          bin/ditx image --target cross --tag ci
          bin/ditx ci cross
      - name: Upload test results
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.ros_distro }}
          path: |
            build/**/test_results/**/*.xml
            build/**/integration/*.log
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'push'
    needs: [lint, build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ROS_DISTRO: humble
      DIT_PLATFORMS: linux/amd64,linux/arm64    # the cross image stays amd64 (docker-bake.hcl)
      DIT_BAKE_CACHE: type=gha,scope=publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the scope check diffs against the previous commit of the push
      # A develop push that only touches docs (docs/, mkdocs.yml, *.md) cannot change an
      # image: skip the rebuild. main and release tags always publish; when the previous
      # commit is unknown (new branch, force push) it publishes too.
      - name: Scope
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          publish=true
          if [[ "$GITHUB_REF" == refs/heads/develop ]] && .github/scripts/docs-only.sh "$BEFORE" "$GITHUB_SHA"; then
            publish=false
            echo "::notice::docs-only push: images not rebuilt"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.publish == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.scope.outputs.publish == 'true'
        uses: ./.github/actions/setup
        with:
          sync-token: ${{ secrets.DIT_SYNC_TOKEN }}
          build-dev-image: none
      - if: steps.scope.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.scope.outputs.publish == 'true'
        run: bin/ditx ci image
