# Reusable pipeline for domain repos (Eurobot-Main, Eurobot-Localization, ...).
# A domain repo's whole CI is:
#
#   # .github/workflows/ci.yml in SeanChangX/Eurobot-Localization
#   on: {pull_request: {}, push: {branches: [develop, main]}}
#   jobs:
#     ci:
#       uses: SeanChangX/DIT-X/.github/workflows/domain-ci.yml@develop
#       with: {domain: localization}
#       secrets: inherit
#
# It checks the domain out inside the shell workspace next to the other domains,
# so the integration test proves this change still talks to everyone else.
# The dev image is built here from the shell checkout (cached between runs), so a
# new apt/rosdep dependency of this domain is picked up by the same PR.
name: domain-ci

on:
  workflow_call:
    inputs:
      domain:
        description: Domain name as listed in ditx.repos (e.g. localization)
        required: true
        type: string
      shell-ref:
        description: Branch/tag of SeanChangX/DIT-X to test against
        required: false
        type: string
        default: develop
    secrets:
      DIT_SYNC_TOKEN:
        required: false

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits title (squash merge uses it as the commit message)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_/-]+\))?!?: .{3,}$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title must look like 'feat(localization): fuse camera pose' (got: $TITLE)"
            exit 1
          fi

  ci:
    runs-on: ubuntu-latest
    env:
      DIT_DEV_IMAGE: ghcr.io/seanchangx/eurobot-dev:ci
      DIT_BAKE_CACHE: type=gha,scope=domain-dev
      DOMAIN: ${{ inputs.domain }}
    steps:
      - name: Checkout shell (SeanChangX/DIT-X @ ${{ inputs.shell-ref }})
        uses: actions/checkout@v7
        with:
          repository: SeanChangX/DIT-X
          ref: ${{ inputs.shell-ref }}
          token: ${{ secrets.DIT_SYNC_TOKEN || github.token }}
      - name: Checkout this domain into domains/${{ inputs.domain }}
        uses: actions/checkout@v7
        with:
          path: domains/${{ inputs.domain }}
      - name: Sync the other domains
        env:
          DIT_SYNC_TOKEN: ${{ secrets.DIT_SYNC_TOKEN }}
        run: |
          if [[ -n "$DIT_SYNC_TOKEN" ]]; then
            git config --global url."https://x-access-token:${DIT_SYNC_TOKEN}@github.com/".insteadOf https://github.com/
          fi
          others=$(sed -n 's|^  domains/\([^:]*\):.*|\1|p' ditx.repos | grep -vx "$DOMAIN" || true)
          # shellcheck disable=SC2086
          [[ -z "$others" ]] || bin/ditx sync $others
      - uses: docker/setup-buildx-action@v4
      # buildx's type=gha cache needs the Actions runtime token, which only JS actions get
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: bin/ditx image --target dev --tag ci
      - run: bin/ditx ci lint -d "$DOMAIN"
      - run: bin/ditx ci build
      - run: bin/ditx ci test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.domain }}
          path: |
            build/**/test_results/**/*.xml
            build/**/integration/*.log
          if-no-files-found: ignore
