# User manual (MkDocs Material, docs/ + mkdocs.yml) → GitHub Pages.
# Pull requests only build it (--strict: broken links and nav entries fail);
# pushes to develop / main also publish it. Enable once: Settings → Pages →
# Source: GitHub Actions. Preview locally: `ditx docs` (same image, see cli.DOCS_IMAGE).
name: docs

on:
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml', 'tools/ditx/**', 'tools/ext/**',
            'tools/docs/**', 'tools/hooks/**', 'config/robots.ini']
  push:
    branches: [develop, main]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml', 'tools/ditx/**', 'tools/ext/**',
            'tools/docs/**', 'tools/hooks/**', 'config/robots.ini']
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # page dates come from git history
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # argparse help layout differs between versions
      # terminal screenshots (docs/assets/term/*.svg) must match what ditx prints today;
      # stateful shots (builds, the sim robot) are regenerated by hand: tools/docs/shots.py --fresh
      - name: Terminal screenshots up to date
        run: |
          command -v tmux >/dev/null || sudo apt-get install -y -qq tmux   # TUI shots
          python3 tools/docs/shots.py --check
      - name: Build (strict)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/docs \
            squidfunk/mkdocs-material:9.8.1 build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
